<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in with Mereka</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap">
  <!-- Local files by default; add ?cdn=sign-in-v0.1.1 to load a tagged release from jsDelivr. -->
  <link id="kit-css" rel="stylesheet" href="./sign-in-with-mereka.css">
  <script>
    (function () {
      var tag = new URLSearchParams(location.search).get("cdn");
      var base = tag ? "https://cdn.jsdelivr.net/gh/Biji-Biji-Initiative/bbbi-mereka-brand-assets@" + encodeURIComponent(tag) + "/packages/sign-in/" : "./";
      if (tag) document.getElementById("kit-css").href = base + "sign-in-with-mereka.css";
      var s = document.createElement("script");
      s.src = base + "sign-in-with-mereka.js";
      s.defer = true;
      document.head.appendChild(s);
    })();
  </script>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 Poppins, system-ui, sans-serif; background: #e9e8e3; color: #202321; }
    header { padding: 24px 32px 8px; }
    header h1 { margin: 0; font-size: 22px; font-weight: 600; }
    header p { margin: 4px 0 0; color: #666963; }
    .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px 32px 32px; }
    .panel { padding: 24px; border-radius: 16px; background: #f8f7f4; border: 1px solid #dcded8; }
    .panel[data-theme="dark"] { background: #171b19; border-color: #49534a; color: #f2f3ed; }
    .panel h2 { margin: 0 0 16px; font-size: 16px; font-weight: 600; }
    h3 { margin: 20px 0 8px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #666963; }
    .panel[data-theme="dark"] h3 { color: #b6bfb5; }
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
    .card { max-width: 340px; padding: 20px; border-radius: 16px; background: #fff; border: 1px solid #dcded8; }
    .panel[data-theme="dark"] .card { background: #232925; border-color: #49534a; }
    code { font-size: 12px; color: #666963; }
    @media (max-width: 900px) { .panels { grid-template-columns: 1fr; padding: 16px; } }
  </style>
</head>
<body>
  <header>
    <h1>Sign in with Mereka</h1>
    <p>@mereka/sign-in: every variant, size, shape, label and state, on a light page and a dark page. On dark surfaces use auto or light; dark is shown there only for contrast.</p>
  </header>
  <main class="panels">
    <section class="panel" data-theme="light" aria-label="Light page"></section>
    <section class="panel" data-theme="dark" aria-label="Dark page"></section>
  </main>

  <template id="specimen">
    <h2></h2>
    <h3>Variants (md, rect): dark, light, brand, auto</h3>
    <div class="row">
      <mereka-signin href="#" variant="dark"></mereka-signin>
      <mereka-signin href="#" variant="light"></mereka-signin>
      <mereka-signin href="#" variant="brand"></mereka-signin>
      <mereka-signin href="#" variant="auto"></mereka-signin>
    </div>
    <h3>Sizes (auto): sm 36px, md 44px, lg 52px</h3>
    <div class="row">
      <mereka-signin href="#" variant="auto" size="sm"></mereka-signin>
      <mereka-signin href="#" variant="auto" size="md"></mereka-signin>
      <mereka-signin href="#" variant="auto" size="lg"></mereka-signin>
    </div>
    <h3>Shapes: rect, pill</h3>
    <div class="row">
      <mereka-signin href="#" variant="light" shape="rect"></mereka-signin>
      <mereka-signin href="#" variant="light" shape="pill"></mereka-signin>
      <mereka-signin href="#" variant="brand" shape="pill" size="sm"></mereka-signin>
    </div>
    <h3>Labels (auto): signin, continue, login</h3>
    <div class="row">
      <mereka-signin href="#" variant="auto" label="signin"></mereka-signin>
      <mereka-signin href="#" variant="auto" label="continue"></mereka-signin>
      <mereka-signin href="#" variant="auto" label="login"></mereka-signin>
    </div>
    <h3>States: loading, disabled</h3>
    <div class="row">
      <mereka-signin type="button" variant="auto" loading></mereka-signin>
      <mereka-signin type="button" variant="light" loading></mereka-signin>
      <mereka-signin type="button" variant="auto" disabled></mereka-signin>
      <mereka-signin type="button" variant="light" disabled></mereka-signin>
    </div>
    <h3>Full width in a card (lg), as on the hosted page</h3>
    <div class="card">
      <div class="row" style="flex-direction:column;align-items:stretch">
        <mereka-signin href="#" size="lg" width="full" variant="auto"></mereka-signin>
        <mereka-signin href="#" size="lg" width="full" variant="light" label="continue"></mereka-signin>
      </div>
    </div>
  </template>

  <template id="static-markup">
    <h3>Static HTML, no JavaScript</h3>
    <div class="row">
      <a class="mereka-signin mereka-signin--light mereka-signin--pill" href="#">
      <span class="mereka-signin__icon" aria-hidden="true">
      <!-- <sign-in:generated> by scripts/build.mjs; do not edit by hand. -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 427.76 342.13" fill="currentColor" class="mereka-signin__mark" aria-hidden="true" focusable="false"><circle cx="363.62" cy="277.69" r="64.14"/><path d="M356.93,128.09c.53,0,1.05,0,1.57.02,1.38.1,2.78.16,4.19.17.21,0,.43,0,.64,0,35.43,0,64.14-28.72,64.14-64.14S398.76,0,363.33,0c-28.15,0-52.06,18.13-60.7,43.36-.01.03-.02.07-.03.1-.42,1.59-.89,3.16-1.4,4.71-.03.1-.05.19-.07.29-11.25,34.08-43.36,58.67-81.2,58.67-.49,0-.98,0-1.47-.01-.14-.01-.29-.02-.44-.03-.47-.03-.94-.06-1.41-.08-.8-.04-1.59-.06-2.4-.07-.12,0-.23,0-.35,0-.02,0-.04,0-.06,0-.02,0-.05,0-.07,0s-.05,0-.07,0c-.02,0-.04,0-.06,0-.12,0-.24,0-.35,0-.8,0-1.6.03-2.4.07-.47.02-.94.05-1.41.08-.14,0-.29.01-.44.03-.49,0-.98.01-1.47.01-37.43,0-69.23-24.06-80.81-57.56-5.26-22.59-22.46-40.59-44.59-47-.2-.06-.41-.12-.61-.17-.61-.17-1.23-.34-1.85-.49-.48-.12-.97-.23-1.46-.34-.39-.09-.78-.18-1.18-.26-.97-.2-1.95-.37-2.93-.52-.08-.01-.17-.02-.25-.04-.99-.15-1.99-.28-2.99-.38h-.07c-2.19-.23-4.41-.36-6.66-.36C28.72,0,0,28.72,0,64.14c0,18.9,8.17,35.88,21.18,47.62,14.82,15.38,23.94,36.27,23.94,59.31s-9.4,44.59-24.62,60.03c-.69.7-1.39,1.39-2.11,2.06,0,0-.01,0-.02.02C7.09,244.75.14,260.56.14,277.98c0,35.42,28.72,64.14,64.14,64.14s64.14-28.72,64.14-64.14c0-17.42-6.95-33.23-18.23-44.79,0,0-.01-.01-.02-.02-.71-.68-1.42-1.36-2.11-2.06-15.23-15.44-24.62-36.64-24.62-60.03,0-14.41,3.58-27.99,9.88-39.9,26.74,7.38,48.22,27.41,57.6,53.26,5.63,26.6,27.75,47.1,55.16,50.33.03,0,.07,0,.1.01.68.08,1.37.15,2.06.2.34.03.68.05,1.02.08.55.04,1.09.07,1.64.1.75.03,1.51.05,2.27.06.16,0,.33.01.49.01.02,0,.05,0,.07,0s.05,0,.07,0c.16,0,.33-.01.49-.01.76,0,1.52-.02,2.27-.06.55-.02,1.1-.06,1.64-.1.34-.02.68-.05,1.02-.08.69-.06,1.38-.12,2.06-.2.03,0,.07,0,.1-.01,27.41-3.23,49.52-23.73,55.16-50.33,11.92-32.86,43.41-56.34,80.38-56.34Z"/></svg>
      <!-- </sign-in:generated> -->
      </span>
      <span class="mereka-signin__label">Sign in with Mereka</span>
      </a>
      <code>&lt;a class="mereka-signin mereka-signin--light mereka-signin--pill"&gt;</code>
    </div>
  </template>

  <script>
    document.querySelectorAll(".panel").forEach(function (panel) {
      panel.appendChild(document.getElementById("specimen").content.cloneNode(true));
      panel.appendChild(document.getElementById("static-markup").content.cloneNode(true));
      panel.querySelector("h2").textContent = panel.dataset.theme === "dark" ? "Dark page (#171b19)" : "Light page (#f8f7f4)";
    });
    document.addEventListener("click", function (e) {
      if (e.target.closest("a[href='#']")) e.preventDefault();
    });
  </script>
</body>
</html>
